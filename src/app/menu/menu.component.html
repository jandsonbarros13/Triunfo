<header>
  <div class="header-content">
    <a class="logo-link" (click)="toggleMenu($event)">
      <img
        src="../../assets/TRIUNFO LOGO ALPHA.png"
        alt="Logo Triunfo"
        class="logo"
      />
    </a>
    <a routerLink="/meu-perfil" class="profile-link">
      <img
        [src]="userProfile?.foto || 'assets/foto.png'" 
        alt="Foto do Usuário"
        class="profile-photo"
        style="cursor: pointer" />
    </a>
  </div>
</header>

<nav class="navbar" [class.open]="isMenuOpen">
  <ul id="menu" [class.hidden-on-close]="!isMenuOpen">
    <li *ngIf="userType === 'master' || cargo === 'Extrusor'">
      <a routerLink="/home" (click)="closeMenu()">
        <span class="material-icons">calculate</span>
        <span class="menu-text">Calculadora</span>
      </a>
    </li>
    <li *ngIf="userType === 'master' || cargo === 'Extrusor'">
      <a routerLink="/bater-ponto" (click)="closeMenu()">
        <span class="material-icons">access_time</span>
        <span class="menu-text">Bater Ponto</span>
      </a>
    </li>
    <li *ngIf="userType === 'master'">
      <a routerLink="/relatorios" (click)="closeMenu()">
        <span class="material-icons">assessment</span>
        <span class="menu-text">Relatórios</span>
      </a>
    </li>
    <li *ngIf="userType === 'master'">
      <a routerLink="/bobinas" (click)="closeMenu()">
        <span class="material-icons">print</span>
        <span class="menu-text">Bobinas</span>
      </a>
    </li>
    <li *ngIf="userType === 'master'">
      <a routerLink="/configuracoes" (click)="closeMenu()">
        <span class="material-icons">settings</span>
        <span class="menu-text">Configurações</span>
      </a>
    </li>
    <li *ngIf="userType === 'master'">
      <a routerLink="/usuarios" (click)="closeMenu()">
        <span class="material-icons">group</span>
        <span class="menu-text">Usuários</span>
      </a>
    </li>
    <li>
      <a (click)="sair()" class="logout-button">
        <span class="material-icons">logout</span>
        <span class="menu-text">Sair</span>
      </a>
    </li>
  </ul>
</nav>
